name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bunx biome ci --reporter=github

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

  package:
    name: Package .vsix
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package
        run: bun run package

      - uses: actions/upload-artifact@v7
        with:
          name: itmo-cpp-labkit-vsix
          path: '*.vsix'
          if-no-files-found: error
